[project]
name = "graphview-mcp"
version = "0.1.0"
description = "See and query any graph-shaped memory in 3D, from an MCP server."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "pyyaml>=6"]

[project.scripts]
graphview = "graphview.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
